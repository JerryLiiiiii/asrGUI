[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "asrgui-m0"
version = "0.1.0"
description = "asrGUI M0 technical feasibility prototype"
requires-python = "==3.11.*"
dependencies = [
    "funasr==1.4.16",
    "modelscope==1.40.2",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "PySide6-Essentials==6.12.0",
    "PySide6-Addons==6.12.0",
    "soundfile==0.14.0",
    "librosa==0.11.0",
    "psutil==7.2.2",
    "pyinstaller==6.22.3",
]

[project.scripts]
asrgui-m0 = "asrgui.m0.cli:main"
asrgui-m0-worker = "asrgui.m0.worker:main"
asrgui-m0-ui = "asrgui.m0.ui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asrgui = ["resources/*.json", "resources/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
